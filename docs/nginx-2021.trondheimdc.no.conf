# 2021.trondheimdc.no — static archive of TDC Community Week 2021. No proxy, no app server.

server {
    listen 80;
    listen [::]:80;
    server_name 2021.trondheimdc.no;

    access_log /var/www/sites/2021.trondheimdc.no/logs/access.log combined;
    error_log  /var/www/sites/2021.trondheimdc.no/logs/error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 on the listen line, not `http2 on;`: the server's nginx predates 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 2021.trondheimdc.no;

    access_log /var/www/sites/2021.trondheimdc.no/logs/access.log combined;
    error_log  /var/www/sites/2021.trondheimdc.no/logs/error.log;

    root /var/www/sites/2021.trondheimdc.no/public;

    # Added by certbot; keep them when copying this file over.
    ssl_certificate     /etc/letsencrypt/live/2021.trondheimdc.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2021.trondheimdc.no/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Note: add_header in a location replaces any from the server level, so each location sets its own.

    # The archive is frozen: assets never change, so they can be cached for a long time.
    location ~* \.(css|js|png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pages. Everything is served from this origin: no third-party scripts, fonts or images.
    # The page has one inline script (the hamburger icon toggle), hence 'unsafe-inline' for scripts.
    location / {
        index index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ =404;
    }
}
